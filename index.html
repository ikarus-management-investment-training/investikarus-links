<!DOCTYPE html>
<html lang="tr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>İkarus - QR Bülten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Archivo:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Archivo', system-ui, sans-serif;
    }
    a { text-decoration: none; }
    button { font-family: inherit; }

    [data-theme="light"], [data-theme="auto"] {
      --bg: #FFFFFF; --surf: #F6FAFA; --surf2: #EFF7F7; --ink: #1B2733; --head: #0F2243; --muted: #5C6B79;
      --rule: #DCE3E9; --hair: #EDF1F5; --accent: #189B93; --accent-d: #116E68; --on-accent: #FFFFFF;
      --bd: rgba(15,34,67,.10);
    }
    [data-theme="dark"] {
      --bg: #1A1C1D; --surf: #232628; --surf2: #282C2C; --ink: #DFE3E5; --head: #F3F5F6; --muted: #9BA2A7;
      --rule: rgba(255,255,255,.13); --hair: rgba(255,255,255,.08); --accent: #1FAEA5; --accent-d: #7CD6D0; --on-accent: #03202A;
      --bd: rgba(255,255,255,.11);
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] {
        --bg: #1A1C1D; --surf: #232628; --surf2: #282C2C; --ink: #DFE3E5; --head: #F3F5F6; --muted: #9BA2A7;
        --rule: rgba(255,255,255,.13); --hair: rgba(255,255,255,.08); --accent: #1FAEA5; --accent-d: #7CD6D0; --on-accent: #03202A;
        --bd: rgba(255,255,255,.11);
      }
    }

    [data-theme="dark"] [data-lightonly] { display: none !important; }
    [data-theme="light"] [data-darkonly] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] [data-lightonly] { display: none !important; }
    }
    @media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) {
      [data-theme="auto"] [data-darkonly] { display: none !important; }
    }

    [data-row]:active { background: var(--surf2) !important; }
    .hero[data-row]:active { background: var(--accent-d) !important; }

    /* Düzen (3B) */
    .app-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 36px 22px 32px;
      background: var(--bg);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .top-bar img { height: 14px; width: auto; display: block; }
    .controls { display: flex; align-items: center; gap: 14px; }

    .btn-icon {
      border: 0;
      background: transparent;
      color: var(--head);
      display: grid;
      place-items: center;
      width: 32px;
      min-height: 32px;
      padding: 0;
      cursor: pointer;
    }
    .btn-text {
      border: 0;
      border-bottom: 2px solid var(--accent);
      background: transparent;
      color: var(--head);
      font: 600 10px/1 'Archivo', sans-serif;
      letter-spacing: .1em;
      padding: 2px 0;
      min-height: 32px;
      cursor: pointer;
    }

    .hero {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      min-height: 88px;
      padding: 0 18px;
      background: var(--accent);
      color: var(--on-accent);
    }
    .hero-text { display: grid; gap: 3px; }
    .hero-eyebrow {
      font: 600 10px/1.2 'Archivo', sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .85;
    }
    .hero-title { font: 600 22px/1.1 'Spectral', serif; }
    .hero-arrow { font: 400 22px/1 'Spectral', serif; }

    .grid-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-item {
      display: grid;
      align-content: space-between;
      min-height: 96px;
      padding: 14px;
      background: var(--surf);
      border-top: 2px solid var(--accent);
      color: var(--head);
    }
    .grid-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .grid-item-top svg { width: 26px; height: 26px; flex: none; }
    .grid-item-top .arrow { color: var(--accent); }
    .grid-item > span:last-child { font: 600 15px/1.2 'Archivo', sans-serif; }

    .offices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .office {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 52px;
      background: var(--surf);
      border-bottom: 2px solid var(--accent);
      color: var(--head);
      font: 600 13px/1.2 'Archivo', sans-serif;
    }
    .office svg { width: 16px; height: 16px; flex: none; }

    .footer-area {
      margin-top: auto;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <img data-lightonly src="assets/ikarus-yazi.svg" alt="İkarus">
      <img data-darkonly src="assets/ikarus-yazi-beyaz.svg" alt="İkarus">
      <div class="controls">
        <button type="button" id="themeToggleBtn" class="btn-icon" aria-label="Tema">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
            <path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"></path>
          </svg>
        </button>
        <button type="button" id="langToggleBtn" class="btn-text">EN</button>
      </div>
    </div>

    <a data-row href="/2609" id="link-openissue" class="hero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;flex:none" aria-hidden="true"><path d="M4 4.5h6.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H4z"></path><path d="M20 4.5h-6.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H20z"></path></svg>
      <span class="hero-text">
        <span class="hero-eyebrow"><span data-i18n="bulletin">Bülten</span> · <span data-i18n="issue">Eylül 2026</span></span>
        <span data-i18n="openissue" class="hero-title">Son sayıyı aç</span>
      </span>
      <span class="hero-arrow" aria-hidden="true">→</span>
    </a>

    <div class="grid-links">
      <a data-row href="https://www.investikarus.com/index.html" id="link-website" target="_blank" rel="noopener" class="grid-item">
        <span class="grid-item-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"></path></svg><span class="arrow" aria-hidden="true">↗</span></span>
        <span data-i18n="web4">Web sitesi</span>
      </a>
      <a data-row href="mailto:info@investikarus.com" id="link-email" class="grid-item">
        <span class="grid-item-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"></rect><path d="M3.6 6.6 12 13l8.4-6.4"></path></svg><span class="arrow" aria-hidden="true">→</span></span>
        <span data-i18n="mail4">E-posta</span>
      </a>
      <a data-row href="tel:+903125118300" id="link-phone" class="grid-item">
        <span class="grid-item-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 3.5h3l1.5 4-2 1.4a12 12 0 0 0 5.4 5.4l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.2 5.7a2 2 0 0 1 2-2.2z"></path></svg><span class="arrow" aria-hidden="true">→</span></span>
        <span data-i18n="phone4">Telefon</span>
      </a>
      <a data-row href="#" id="link-archive" class="grid-item">
        <span class="grid-item-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h9.5a2 2 0 0 1 2 2v11H6a2 2 0 0 1-2-2z"></path><path d="M15.5 8.5H19a1 1 0 0 1 1 1v7a2 2 0 0 1-2 2h-2.5"></path><path d="M7 9h6M7 12h6M7 15h4"></path></svg><span class="arrow" aria-hidden="true">→</span></span>
        <span data-i18n="archive4">Bülten arşivi</span>
      </a>
      <a data-row href="https://www.linkedin.com/company/i̇karus-yöneti̇m/?viewAsMember=true" id="link-linkedin" target="_blank" rel="noopener" class="grid-item">
        <span class="grid-item-top"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.6 8.9h2.9V19H4.6zM6 4.2a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4zM9.6 8.9h2.8v1.4a3.1 3.1 0 0 1 2.8-1.5c2.2 0 3.4 1.4 3.4 4V19h-2.9v-5.6c0-1.3-.5-2.1-1.6-2.1s-1.8.8-1.8 2.1V19H9.6z"></path></svg><span class="arrow" aria-hidden="true">↗</span></span>
        <span>LinkedIn</span>
      </a>
      <a data-row href="https://www.instagram.com/ikarusyonetim?igsh=MzBuZzRuMnZyZ3h4" id="link-instagram" target="_blank" rel="noopener" class="grid-item">
        <span class="grid-item-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.6"></rect><circle cx="12" cy="12" r="3.9"></circle><circle cx="16.9" cy="7.1" r="1" fill="currentColor" stroke="none"></circle></svg><span class="arrow" aria-hidden="true">↗</span></span>
        <span>Instagram</span>
      </a>
    </div>

    <div class="offices" role="group" aria-label="Ofisler" data-i18n-label="offices4">
      <a data-row href="https://www.google.com/maps/search/?api=1&query=Alacaatlı+Mahallesi+3306%2F1+Sokak+No%3A9+06810+Çankaya+Ankara" id="link-ankara" target="_blank" rel="noopener" class="office">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s6.4-6.1 6.4-10.4A6.4 6.4 0 0 0 5.6 10.6C5.6 14.9 12 21 12 21z"></path><circle cx="12" cy="10.4" r="2.4"></circle></svg>
        <span>Ankara</span>
      </a>
      <a data-row href="https://www.google.com/maps/search/?api=1&query=Emirgan+Mah.+Sakıp+Sabancı+Cd.+No%3A36%2F10+Sarıyer+İstanbul" id="link-istanbul" target="_blank" rel="noopener" class="office">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s6.4-6.1 6.4-10.4A6.4 6.4 0 0 0 5.6 10.6C5.6 14.9 12 21 12 21z"></path><circle cx="12" cy="10.4" r="2.4"></circle></svg>
        <span>İstanbul</span>
      </a>
      <a data-row href="https://www.google.com/maps/search/?api=1&query=48+Carnarvon+Road+E1B+2NU+London+UK" id="link-london" target="_blank" rel="noopener" class="office">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s6.4-6.1 6.4-10.4A6.4 6.4 0 0 0 5.6 10.6C5.6 14.9 12 21 12 21z"></path><circle cx="12" cy="10.4" r="2.4"></circle></svg>
        <span data-i18n="london4">Londra</span>
      </a>
    </div>

    <div class="footer-area">
      <img data-lightonly src="assets/ikarus-yazi-slogan.svg" alt="İkarus" style="width:118px;height:auto;display:block;opacity:.75">
      <img data-darkonly src="assets/ikarus-yazi-slogan-beyaz.svg" alt="İkarus" style="width:118px;height:auto;display:block;opacity:.75">
    </div>
  </div>

  <div id="comingSoonModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,34,67,0.4); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    <div style="background: var(--bg); color: var(--ink); padding: 24px 32px; border-radius: 14px; border: 1px solid var(--bd); box-shadow: 0 8px 24px rgba(15,34,67,0.12); text-align: center; max-width: 80%; transform: translateY(10px); animation: modalRise 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;">
      <div data-i18n="comingsoon" style="font: 600 17px/1.4 'Archivo', sans-serif; color: var(--head);">Çok yakında...</div>
      <button type="button" id="closeModalBtn" style="margin-top: 20px; background: var(--surf); color: var(--head); border: 1px solid var(--bd); padding: 10px 24px; border-radius: 8px; font: 600 14px/1 'Archivo', sans-serif; cursor: pointer;">
        <span data-i18n="close">Kapat</span>
      </button>
    </div>
  </div>
  <style>
    @keyframes modalRise {
      to { transform: translateY(0); }
    }
  </style>

  <script>
    // Theme logic
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const htmlEl = document.documentElement;

    const iconMoon = '<path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"></path>';
    const iconSun = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

    function updateThemeIcon(theme) {
      const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      themeIcon.innerHTML = isDark ? iconSun : iconMoon;
    }

    let currentTheme = localStorage.getItem('ikarus-theme') || 'auto';
    htmlEl.setAttribute('data-theme', currentTheme);
    updateThemeIcon(currentTheme);

    themeBtn.addEventListener('click', () => {
      const isDark = currentTheme === 'dark' || (currentTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      currentTheme = isDark ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', currentTheme);
      localStorage.setItem('ikarus-theme', currentTheme);
      updateThemeIcon(currentTheme);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentTheme === 'auto') {
        updateThemeIcon('auto');
      }
    });

    // Language logic
    const langBtn = document.getElementById('langToggleBtn');
    let currentLang = localStorage.getItem('ikarus-lang') || 'tr';

    const translations = {
      'tr': {
        'bulletin': 'Bülten',
        'openissue': 'Son sayıyı aç',
        'issue': 'Eylül 2026',
        'web4': 'Web sitesi',
        'mail4': 'E-posta',
        'phone4': 'Telefon',
        'archive4': 'Bülten arşivi',
        'offices4': 'Ofisler',
        'london4': 'Londra',
        'toggleLabel': 'EN',
        'comingsoon': 'Çok yakında...',
        'close': 'Kapat'
      },
      'en': {
        'bulletin': 'Newsletter',
        'openissue': 'Open latest issue',
        'issue': 'September 2026',
        'web4': 'Website',
        'mail4': 'Email',
        'phone4': 'Phone',
        'archive4': 'Newsletter archive',
        'offices4': 'Offices',
        'london4': 'London',
        'toggleLabel': 'TR',
        'comingsoon': 'Coming soon...',
        'close': 'Close'
      }
    };

    function applyLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      document.querySelectorAll('[data-i18n-label]').forEach(el => {
        const key = el.getAttribute('data-i18n-label');
        if (translations[lang][key]) {
          el.setAttribute('aria-label', translations[lang][key]);
        }
      });
      langBtn.textContent = translations[lang].toggleLabel;
      htmlEl.setAttribute('lang', lang);
    }

    applyLanguage(currentLang);

    langBtn.addEventListener('click', () => {
      currentLang = currentLang === 'tr' ? 'en' : 'tr';
      localStorage.setItem('ikarus-lang', currentLang);
      applyLanguage(currentLang);
    });

    // Coming soon modal logic
    const modal = document.getElementById('comingSoonModal');
    const closeBtn = document.getElementById('closeModalBtn');

    function openModal(e) {
      e.preventDefault();
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    // Son sayı gerçek bir sayfaya bağlı; yalnızca arşiv henüz hazır değil.
    document.getElementById('link-archive').addEventListener('click', openModal);

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
