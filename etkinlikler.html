<!DOCTYPE html>
<html lang="tr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İkarus - Geçmiş Etkinlikler</title>
  <meta name="description" content="İkarus etkinliklerinin sunumları ve belgeleri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Archivo', system-ui, sans-serif;
    }
    a { text-decoration: none; }
    button { font-family: inherit; }

    /* Renk belirteçleri index.html ile aynı; biri değişirse öteki de değişmeli. */
    [data-theme="light"], [data-theme="auto"] {
      --bg: #FFFFFF; --surf: #F6FAFA; --surf2: #EFF7F7; --ink: #1B2733; --head: #0F2243; --muted: #5C6B79;
      --rule: #DCE3E9; --hair: #EDF1F5; --accent: #189B93; --accent-d: #116E68; --on-accent: #FFFFFF;
      --bd: rgba(15,34,67,.10);
    }
    [data-theme="dark"] {
      --bg: #1A1C1D; --surf: #232628; --surf2: #282C2C; --ink: #DFE3E5; --head: #F3F5F6; --muted: #9BA2A7;
      --rule: rgba(255,255,255,.13); --hair: rgba(255,255,255,.08); --accent: #1FAEA5; --accent-d: #7CD6D0; --on-accent: #03202A;
      --bd: rgba(255,255,255,.11);
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] {
        --bg: #1A1C1D; --surf: #232628; --surf2: #282C2C; --ink: #DFE3E5; --head: #F3F5F6; --muted: #9BA2A7;
        --rule: rgba(255,255,255,.13); --hair: rgba(255,255,255,.08); --accent: #1FAEA5; --accent-d: #7CD6D0; --on-accent: #03202A;
        --bd: rgba(255,255,255,.11);
      }
    }

    [data-theme="dark"] [data-lightonly] { display: none !important; }
    [data-theme="light"] [data-darkonly] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] [data-lightonly] { display: none !important; }
    }
    @media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) {
      [data-theme="auto"] [data-darkonly] { display: none !important; }
    }

    [data-row]:active { background: var(--surf2) !important; }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 36px 22px 32px;
      background: var(--bg);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .top-bar img { height: 14px; width: auto; display: block; }
    .controls { display: flex; align-items: center; gap: 14px; }

    .btn-icon {
      border: 0;
      background: transparent;
      color: var(--head);
      display: grid;
      place-items: center;
      width: 32px;
      min-height: 32px;
      padding: 0;
      cursor: pointer;
    }
    .btn-text {
      border: 0;
      border-bottom: 2px solid var(--accent);
      background: transparent;
      color: var(--head);
      font: 600 10px/1 'Archivo', sans-serif;
      letter-spacing: .1em;
      padding: 2px 0;
      min-height: 32px;
      cursor: pointer;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      min-height: 32px;
      color: var(--accent-d);
      font: 600 13px/1 'Archivo', sans-serif;
    }
    .page-head { display: grid; gap: 6px; }
    .page-head h1 {
      margin: 0;
      color: var(--head);
      font: 600 28px/1.1 'Spectral', serif;
    }
    .page-head p {
      margin: 0;
      color: var(--muted);
      font: 400 14px/1.45 'Archivo', sans-serif;
    }

    /* Etkinlik bandı index.html'deki ile aynı: lacivert zemin iki temada da aynı kalır.
       Lacivert/beyaz 16:1, üst etiket 9:1. */
    .events { display: grid; gap: 10px; }
    .event {
      display: grid;
      gap: 12px;
      padding: 14px 12px 12px;
      background: #0F2243;
      color: #FFFFFF;
    }
    .event-head { display: grid; gap: 4px; padding: 0 2px; }
    .event-kicker {
      color: #7CD6D0;
      font: 600 10px/1.2 'Archivo', sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .event-name { margin: 0; font: 600 21px/1.15 'Spectral', serif; text-wrap: balance; }
    .event-desc { margin: 2px 0 0; color: rgba(255,255,255,.78); font: 400 13px/1.45 'Archivo', sans-serif; }
    .event-actions { display: grid; gap: 8px; }
    .event-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 12px;
      background: #FFFFFF;
      color: #0F2243;
      font: 600 15px/1.2 'Archivo', sans-serif;
    }
    .event-btn svg { width: 22px; height: 22px; flex: none; color: #116E68; }
    .event-btn span { white-space: nowrap; }
    .event-btn[data-row]:active { background: #E3F1F0 !important; }

    .footer-area {
      margin-top: auto;
      padding-top: 8px;
    }

    @media (hover: hover) {
      .event-btn { transition: background-color .15s ease-out; }
      .event-btn:hover { background: #E3F1F0; }
      .btn-icon:hover, .btn-text:hover { color: var(--accent); }
    }

    @media (min-width: 720px) {
      .event-kicker { font-size: 11px; }
      .event { grid-template-columns: minmax(0, 1fr) minmax(200px, auto); align-items: center; gap: 24px; padding: 22px 22px 22px 24px; }
      .event-head { gap: 6px; padding: 0; }
      .event-name { font-size: 26px; }
      .event-btn { min-height: 56px; padding: 0 18px; font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <a href="/" aria-label="İkarus">
        <img data-lightonly src="assets/ikarus-yazi.svg" alt="İkarus">
        <img data-darkonly src="assets/ikarus-yazi-beyaz.svg" alt="İkarus">
      </a>
      <div class="controls">
        <button type="button" id="themeToggleBtn" class="btn-icon" aria-label="Tema">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
            <path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"></path>
          </svg>
        </button>
        <button type="button" id="langToggleBtn" class="btn-text">EN</button>
      </div>
    </div>

    <a href="/" class="back"><span aria-hidden="true">←</span> <span data-i18n="back">Ana sayfa</span></a>

    <div class="page-head">
      <h1 data-i18n="title">Geçmiş etkinlikler</h1>
      <p data-i18n="lede">Etkinliklerimizde gösterilen sunumlar ve salondan gelen soruların cevapları.</p>
    </div>

    <!-- Yeni etkinlik en üste eklenir. Yaklaşan etkinlik ana sayfadaki bantta durur;
         etkinlik geçince bant buraya taşınır (Share&Connect: 06.11.2026). -->
    <div class="events">
      <section class="event" aria-labelledby="event-sc-arge">
        <div class="event-head">
          <span class="event-kicker" data-i18n="kSc">ODTÜ Teknokent · 27 Ekim 2026</span>
          <h2 id="event-sc-arge" class="event-name" data-i18n="nSc">Share&amp;Connect: Ar-Ge Destekleri</h2>
          <p class="event-desc" data-i18n="dSc">Açılış, KOSGEB ve TÜBİTAK sunumları; salondan gelen soruların cevapları.</p>
        </div>
        <div class="event-actions">
          <a data-row href="/share-connect-arge-destekleri/" id="link-sc-sunumlar" class="event-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.2"></rect><path d="M12 16v4M8.5 20h7M7.5 12.5l3-3 2.5 2 3.5-4"></path></svg>
            <span data-i18n="bScSunum">Sunumlar ve soru-cevap</span>
          </a>
          <a data-row href="https://form.investikarus.com/" id="link-sc-form" class="event-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H6.5A1.5 1.5 0 0 0 5 5.5v14A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-14A1.5 1.5 0 0 0 17.5 4H16"></path><rect x="8" y="2.8" width="8" height="2.6" rx=".8"></rect><path d="M8.5 10.5h7M8.5 14h7M8.5 17.5h4"></path></svg>
            <span data-i18n="bScForm">Firma iletişim formu</span>
          </a>
        </div>
      </section>
    </div>

    <div class="footer-area">
      <img data-lightonly src="assets/ikarus-yazi-slogan.svg" alt="İkarus" style="width:118px;height:auto;display:block;opacity:.75">
      <img data-darkonly src="assets/ikarus-yazi-slogan-beyaz.svg" alt="İkarus" style="width:118px;height:auto;display:block;opacity:.75">
    </div>
  </div>

  <script>
    // Tema ve dil tercihi index.html ile aynı localStorage anahtarlarında tutulur.
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const htmlEl = document.documentElement;

    const iconMoon = '<path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"></path>';
    const iconSun = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

    function updateThemeIcon(theme) {
      const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      themeIcon.innerHTML = isDark ? iconSun : iconMoon;
    }

    let currentTheme = localStorage.getItem('ikarus-theme') || 'auto';
    htmlEl.setAttribute('data-theme', currentTheme);
    updateThemeIcon(currentTheme);

    themeBtn.addEventListener('click', () => {
      const isDark = currentTheme === 'dark' || (currentTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      currentTheme = isDark ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', currentTheme);
      localStorage.setItem('ikarus-theme', currentTheme);
      updateThemeIcon(currentTheme);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentTheme === 'auto') {
        updateThemeIcon('auto');
      }
    });

    const langBtn = document.getElementById('langToggleBtn');
    let currentLang = localStorage.getItem('ikarus-lang') || 'tr';

    const translations = {
      'tr': {
        'back': 'Ana sayfa',
        'title': 'Geçmiş etkinlikler',
        'lede': 'Etkinliklerimizde gösterilen sunumlar ve salondan gelen soruların cevapları.',
        'kSc': 'ODTÜ Teknokent · 27 Ekim 2026',
        'nSc': 'Share&Connect: Ar-Ge Destekleri',
        'dSc': 'Açılış, KOSGEB ve TÜBİTAK sunumları; salondan gelen soruların cevapları.',
        'bScSunum': 'Sunumlar ve soru-cevap',
        'bScForm': 'Firma iletişim formu',
        'toggleLabel': 'EN'
      },
      'en': {
        'back': 'Home',
        'title': 'Past events',
        'lede': 'Presentations shown at our events and answers to questions from the floor. Materials are in Turkish.',
        'kSc': 'ODTÜ Teknokent · 27 October 2026',
        'nSc': 'Share&Connect: R&D Support',
        'dSc': 'Opening, KOSGEB and TÜBİTAK presentations; answers to questions from the floor.',
        'bScSunum': 'Presentations and Q&A',
        'bScForm': 'Company contact form',
        'toggleLabel': 'TR'
      }
    };

    function applyLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      langBtn.textContent = translations[lang].toggleLabel;
      htmlEl.setAttribute('lang', lang);
    }

    applyLanguage(currentLang);

    langBtn.addEventListener('click', () => {
      currentLang = currentLang === 'tr' ? 'en' : 'tr';
      localStorage.setItem('ikarus-lang', currentLang);
      applyLanguage(currentLang);
    });
  </script>
</body>
</html>
